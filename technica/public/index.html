<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#174c3c" />
    <meta
      name="description"
      content="Practice everyday money choices. Learn as you play. A free, welcoming game with fictional money and room to try again."
    />
    <title>Harborbound · An everyday money RPG</title>
    <link rel="icon" href="assets/mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="rpg.css" />
    <script src="content.js" defer></script>
    <script src="game.js" defer></script>
    <script src="play.js" defer></script>
    <script src="world.js" defer></script>
    <script src="rpg.js" defer></script>
    <script src="rpg-view.js" defer></script>
    <script src="learn-view.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header class="site-header">
      <a href="#play" class="brand" aria-label="Harbor Academy, Play"
        ><img src="assets/mark.svg" alt="" width="40" height="40" /><span
          >harbor <span class="brand-small">academy</span></span
        ></a
      >
      <nav aria-label="Main navigation">
        <a href="#play">Play</a><a href="#learn">Learn</a
        ><a href="#journal">Quest Journal</a>
      </nav>
      <details class="progress-panel">
        <summary>Your progress <span aria-hidden="true">↗</span></summary>
        <div id="progress-content"></div>
      </details>
    </header>
    <div
      id="storage-message"
      role="status"
      class="storage-message"
      hidden
    ></div>
    <main id="main" tabindex="-1"><p>Getting your adventure ready…</p></main>
    <noscript
      ><p class="notice">
        The game needs JavaScript enabled. No account or API key is needed.
      </p></noscript
    >
    <footer>
      <a class="footer-brand" href="#play"
        >A little practice. More possibilities.</a
      >
      <p>Fictional money. Real-life skills. Room to try again.</p>
      <span>Harbor Academy · Education, at your pace</span
      ><a href="remove.html">Past contribution removal</a>
    </footer>
    <div
      id="announcement"
      role="status"
      aria-live="polite"
      class="sr-only"
    ></div>
  </body>
</html>
